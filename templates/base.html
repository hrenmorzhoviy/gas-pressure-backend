<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>{% block title %}Газовый калькулятор{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% if not request.url.path.startswith('/feed') %}
    <header class="header">
        <a href="/" class="home-link">
            <i class="fas fa-flask"></i> Газовый калькулятор
        </a>
    </header>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    <nav class="bottom-nav">
        <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
            <i class="fas fa-th"></i> Газы
        </a>
        <a href="/add" class="nav-item {% if request.url.path == '/add' %}active{% endif %}">
            <i class="fas fa-plus-circle"></i> Добавить
        </a>
        <a href="/feed/1" class="nav-item {% if request.url.path.startswith('/feed') %}active{% endif %}">
            <i class="fas fa-play-circle"></i> Лента
        </a>
    </nav>
</body>
</html>
